name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          VITE_GH_PAGES: "true"
        run: |
          npm run build
          # public/404.html (SPA hack) is already copied to dist/404.html by Vite — don't overwrite it
          # Ensure GitHub Pages doesn't ignore _assets
          touch dist/.nojekyll
          echo "Built with base $(grep -o 'src=\"[^\"]*\"' dist/index.html | head -1)"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
